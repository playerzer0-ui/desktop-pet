about = "a story one of Pip's elderly Freeport visitors told her this week"

[[topics]]
stage = 2
starts = "mira"
about = "the price of flour jumping around again because nobody knows what Republicia will do"

[[topics]]
stage = 2
starts = "pip"
about = "a strange new coin that came through Pip's currency exchange"

[[topics]]  # stage 3: dreamwalking and the chapel
