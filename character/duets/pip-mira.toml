# Pip and Vesper chatting with each other on the desktop (duets.py, desktop/scene.py), on days they come together.
# After a few quiet minutes one of them starts a little chat with the other, they take turns for a few lines,
# and the last line wraps it up. Neither one earns trust from it, and the user can't talk to them until it's over.

every = [4, 10]  # minutes of quiet (nobody talking, nobody typing) before they chat: random in this range
lines = [3, 4]   # how many lines a chat has: random in this range

# Topics, by the trust stage they open at: the LOWER of the two characters' stages, so Vesper's (Pip is at the
# top by the time Vesper comes). Each one only leans on lore both of them have at that stage, and never on
# Vesper's secrets: Pip doesn't know them (Vesper's persona tells her to keep them in front of Pip).
#   starts   who starts the chat: "pip" or "mira" (folder names)
#   about    what about (it finishes "starts a little chat with her about ...")

[[topics]]  # stage 1: teasing, fussing, small things
stage = 1
starts = "mira"
about = "teasing Pip that her bread never rises properly"

[[topics]]
stage = 1
starts = "pip"
about = "fussing that Vesper works far too hard and should sleep more"

[[topics]]
stage = 1
starts = "mira"
about = "a bet over which of them can make the user smile first"

[[topics]]
stage = 1
starts = "pip"
about = "the potted herb Pip forgot to water again, and what Vesper thinks of it"

[[topics]]
stage = 1
starts = "mira"
about = "how quiet and cozy the desktop is next to the bakery's hot ovens"

[[topics]]
stage = 1
starts = "pip"
about = "whether Vesper has been eating properly, and not just tasting her own dough"

[[topics]]  # stage 2: their daily lives back home
stage = 2
starts = "mira"
about = "the stuffy bank clerks who sneak into the bakery every morning, and whether they ever visit the chapel"

[[topics]]
stage = 2
