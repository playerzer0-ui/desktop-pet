# Builds the game for Windows and Linux on GitHub's computers, so neither has to be built on yours.
#
# Run it: the repo's Actions tab -> "Build the game" -> "Run workflow". It also runs by itself when you push a
# version tag (git tag v1.2.0, then git push origin v1.2.0).
# Get the builds: open the run once it's green; at the bottom, under Artifacts, are DesktopPet-windows and
# DesktopPet-linux (GitHub wraps each in a zip of its own: inside are DesktopPet-windows.zip / DesktopPet-linux.tar.gz).
# Send them to itch.io too: tick "Upload to itch.io" when you run it (needs the BUTLER_API_KEY secret and the
# ITCH_GAME variable, see the itch job at the bottom). Version tags always upload, when those are set.
#
# How it fits together: two jobs (windows, linux) run at the same time, each on a fresh machine. Each does what you'd
# do by hand: get the code, install Python and the packages, get llama-server, run the tests, run the build script
# (build.ps1 / build.sh, the same ones you run at home), and keep the result. The itch job waits for both.
name: Build the game

on:
  workflow_dispatch:          # the "Run workflow" button
    inputs:
      itch:
        description: "Upload to itch.io"
        type: boolean
        default: false
  push:
    tags: ["v*"]              # pushing a tag like v1.2.0

env:
  PYTHON: "3.13"
  # The llama.cpp release whose llama-server goes in the game (https://github.com/ggml-org/llama.cpp/releases).
  # Change it to update llama.cpp; the same one is used for both, so they behave the same.
  LLAMA_CPP: b11680

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON }}

      - name: The project's Python (.venv) and its packages
        shell: powershell
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements.txt

      # The Vulkan package is the one winget installs (setup.bat); build.ps1 leaves its Vulkan file out anyway.
      # It goes on PATH, where server.py's find_llama_server looks.
      - name: Get llama-server
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "llama.cpp"
          gh release download $env:LLAMA_CPP --repo ggml-org/llama.cpp --pattern "llama-$env:LLAMA_CPP-bin-win-vulkan-x64.zip" --dir $env:RUNNER_TEMP
          Expand-Archive (Join-Path $env:RUNNER_TEMP "llama-$env:LLAMA_CPP-bin-win-vulkan-x64.zip") $dir
          $server = Get-ChildItem $dir -Recurse -Filter llama-server.exe | Select-Object -First 1
          Add-Content $env:GITHUB_PATH $server.DirectoryName

      - name: Tests
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen   # (no screen to draw on here)
        run: |
          .venv\Scripts\python.exe -m desktop.check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .venv\Scripts\python.exe -m unittest discover -s tests

      - name: Build
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen   # (build.ps1 makes the icon with Qt)
        run: .\build.ps1

      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: DesktopPet-windows
          path: dist/DesktopPet-windows.zip
          if-no-files-found: error

  linux:
    # The oldest Ubuntu GitHub offers: the build runs on Linux versions this new or newer (see build.sh).
    runs-on: ubuntu-22.04
    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON }}

      # What Qt's X11 plugin needs from the system: PyInstaller copies these into the build, so they have to be
      # here (build.sh checks that none is missing).
      - name: System libraries for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libegl1 libgl1 \
            libfontconfig1 libdbus-1-3

      - name: The project's Python (.venv) and its packages
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Get llama-server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="$RUNNER_TEMP/llama.cpp"
          mkdir -p "$dir"
          gh release download "$LLAMA_CPP" --repo ggml-org/llama.cpp --pattern "llama-$LLAMA_CPP-bin-ubuntu-x64.tar.gz" --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/llama-$LLAMA_CPP-bin-ubuntu-x64.tar.gz" -C "$dir"
          dirname "$(find "$dir" -name llama-server -type f | head -1)" >> "$GITHUB_PATH"

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          .venv/bin/python -m desktop.check
          .venv/bin/python -m unittest discover -s tests

      - name: Build
        run: ./build.sh

      - name: Keep the build
        uses: actions/upload-artifact@v7
        with:
          name: DesktopPet-linux
          path: dist/DesktopPet-linux.tar.gz
          if-no-files-found: error

  # Sends both builds to itch.io with butler, as the "windows" and "linux" downloads on the game's page.
  # Set up once, in the repo's Settings -> Secrets and variables -> Actions:
  #   Secrets tab:   BUTLER_API_KEY = an API key from https://itch.io/user/settings/api-keys
  #   Variables tab: ITCH_GAME      = your-itch-name/your-game (as in your-itch-name.itch.io/your-game)
  itch:
    needs: [windows, linux]
    if: inputs.itch || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_GAME: ${{ vars.ITCH_GAME }}
    steps:
      - name: Check it's set up
        run: |
          [ -n "$BUTLER_API_KEY" ] || { echo "::error::Add the BUTLER_API_KEY secret first (see build.yml)."; exit 1; }
          [ -n "$ITCH_GAME" ] || { echo "::error::Add the ITCH_GAME variable first (see build.yml)."; exit 1; }

      - name: Get the builds
        uses: actions/download-artifact@v8
        with:
          path: builds

      # butler gets the folders, not the zip / tar.gz: it keeps the Linux files runnable, and after the first upload
      # it only sends what changed.
      - name: Unpack them
        run: |
          mkdir -p windows linux
          unzip -q builds/DesktopPet-windows/DesktopPet-windows.zip -d windows
          tar -xzf builds/DesktopPet-linux/DesktopPet-linux.tar.gz -C linux

      - name: Get butler
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler
          chmod +x butler/butler
          butler/butler -V

      - name: Upload to itch.io
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="$(echo "$GITHUB_SHA" | cut -c1-7)"
          butler/butler push windows/DesktopPet "$ITCH_GAME:windows" --userversion "$version"
          butler/butler push linux/DesktopPet "$ITCH_GAME:linux" --userversion "$version"
